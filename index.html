<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domácí práce</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 18px;
    }

    section {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .service {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      text-align: center;
    }

    .service h3 {
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-top: 8px;
    }

    .booking {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
      background: #dcfce7;
      color: #166534;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      text-align: center;
      background: #1f2937;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h1>Domácí práce</h1>
  <p>Pomoc s prací kolem domu a zahrady</p>
</header>

<section>
  <h2>Ceník</h2>

  <div class="services">

    <div class="service">
      <h3>🌱 Sekání trávy</h3>
      <p class="price">100 Kč / hod</p>
    </div>

    <div class="service">
      <h3>🪟 Mytí oken</h3>
      <p class="price">50 Kč / hod</p>
    </div>

    <div class="service">
      <h3>🪵 Sekání dřeva</h3>
      <p class="price">150 Kč / hod</p>
    </div>

    <div class="service">
      <h3>🪵 Skládání dřeva</h3>
      <p class="price">100 Kč / hod</p>
    </div>

    <div class="service">
      <h3>🧹 Zametání</h3>
      <p class="price">50 Kč / hod</p>
    </div>

  </div>
</section>

<section>
  <h2>Rezervace</h2>

  <div class="booking">

    <label for="service">Vyberte práci:</label>

    <select id="service">
      <option value="">-- Vyberte práci --</option>
      <option>Sekání trávy</option>
      <option>Mytí oken</option>
      <option>Sekání dřeva</option>
      <option>Skládání dřeva</option>
      <option>Zametání</option>
    </select>


    <label for="date">Vyberte den:</label>

    <input type="date" id="date">


    <label for="time">Vyberte čas:</label>

    <select id="time">
      <option value="">-- Vyberte čas --</option>
    </select>


    <label for="name">Jméno:</label>

    <input type="text" id="name" placeholder="Vaše jméno">


    <label for="phone">Telefon:</label>

    <input type="tel" id="phone" placeholder="Telefonní číslo">


    <label for="note">Poznámka:</label>

    <textarea id="note" placeholder="Např. adresa nebo další informace"></textarea>


    <button onclick="reserve()">
      Rezervovat termín
    </button>

    <div id="message"></div>

  </div>
</section>

<footer>
  Domácí práce • Rychlá a spolehlivá pomoc
</footer>


<script>

  const timeSelect = document.getElementById("time");
  const dateInput = document.getElementById("date");

  // Dnešní datum
  const today = new Date();
  const todayString = today.toISOString().split("T")[0];

  dateInput.min = todayString;


  // Vytvoření časů
  function createTimes() {

    timeSelect.innerHTML =
      '<option value="">-- Vyberte čas --</option>';

    for (let hour = 9; hour <= 18; hour++) {

      if (hour < 18) {

        let option = document.createElement("option");

        option.value =
          String(hour).padStart(2, "0") + ":00";

        option.textContent =
          String(hour).padStart(2, "0") + ":00";

        timeSelect.appendChild(option);
      }
    }
  }

  createTimes();


  function reserve() {

    const service =
      document.getElementById("service").value;

    const date =
      document.getElementById("date").value;

    const time =
      document.getElementById("time").value;

    const name =
      document.getElementById("name").value;

    const phone =
      document.getElementById("phone").value;

    const note =
      document.getElementById("note").value;


    if (!service || !date || !time || !name || !phone) {

      alert("Vyplň prosím všechna povinná políčka.");

      return;
    }


    const message =
      document.getElementById("message");

    message.style.display = "block";

    message.innerHTML =
      "✅ Rezervace byla odeslána!<br><br>" +
      "<b>Práce:</b> " + service + "<br>" +
      "<b>Datum:</b> " + date + "<br>" +
      "<b>Čas:</b> " + time + "<br>" +
      "<b>Jméno:</b> " + name;

  }

</script>

</body>
</html>
